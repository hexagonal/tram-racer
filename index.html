<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tram Racer">
  <meta name="theme-color" content="#15171c">
  <title>Tram Racer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #15171c;
      color: #e8e8e8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
      height: 100vh;
      height: 100dvh;
    }
    canvas {
      display: block;
      /* As big as fits, keeping 16:9. */
      width: min(100%, 960px, calc((100dvh - 80px) * 16 / 9));
      height: auto;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      background: #000;
    }
    p.help {
      margin: 0;
      font-size: 14px;
      color: #9aa0a6;
      text-align: center;
    }
    kbd {
      background: #2a2d33;
      border: 1px solid #44484f;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
    }
    .rotate {
      display: none;
      color: #9aa0a6;
      font-size: 15px;
      text-align: center;
    }
    /* Phones and tablets: fill the screen edge to edge, no keyboard help. */
    @media (pointer: coarse) {
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        gap: 10px;
      }
      canvas {
        width: min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),
                   (100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 16 / 9);
        border-radius: 0;
        box-shadow: none;
      }
      p.help { display: none; }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      .rotate { display: block; }
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <p class="help">
    Power / run: <kbd>→</kbd> or <kbd>D</kbd> &nbsp;·&nbsp;
    Brake: <kbd>←</kbd> or <kbd>A</kbd> &nbsp;·&nbsp;
    (<kbd>W</kbd>/<kbd>↑</kbd> and <kbd>S</kbd>/<kbd>↓</kbd> work too) &nbsp;·&nbsp;
    <kbd>Enter</kbd> start
  </p>
  <p class="rotate">Turn your phone sideways for a bigger view.<br>Hold the right side of the screen for power, the left side to brake.</p>
  <script src="game.js"></script>
</body>
</html>
